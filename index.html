<style>

.intro-bars span:nth-child(1){height:9px}.intro-bars span:nth-child(2){height:18px}.intro-bars span:nth-child(3){height:13px}.intro-bars span:nth-child(4){height:24px}.intro-bars span:nth-child(5){height:16px}.intro-bars span:nth-child(6){height:21px}.intro-bars span:nth-child(7){height:11px}


header{display:flex;align-items:center;justify-content:space-between;margin:3px 0 11px}.brand{font-weight:1000;letter-spacing:.13em}.count{color:#aaa;font-size:14px}
.scene{perspective:1200px;width:100%;aspect-ratio:3/4.35}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s;border-radius:28px}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #34343c;overflow:hidden;box-shadow:0 22px 60px #0007}
.front{padding:27px;display:flex;flex-direction:column;background:radial-gradient(circle at 12% 8%,rgba(130,87,229,.30),transparent 30%),radial-gradient(circle at 88% 18%,rgba(255,79,145,.24),transparent 28%),radial-gradient(circle at 55% 100%,rgba(52,152,219,.22),transparent 38%),linear-gradient(155deg,#1a1723,#121219 52%,#17131f)}.back{transform:rotateY(180deg);padding:20px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;background:radial-gradient(circle at 14% 12%,rgba(74,183,255,.25),transparent 30%),radial-gradient(circle at 86% 16%,rgba(255,95,158,.26),transparent 30%),radial-gradient(circle at 50% 95%,rgba(141,92,255,.24),transparent 38%),linear-gradient(155deg,#1b1726,#111117 55%,#17131f)}
.k{font-size:12px;letter-spacing:.15em;color:#999;font-weight:800}.n{font-size:14px;color:#c4c4cc;margin-top:6px}.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.logo{font-size:49px;font-weight:1000;letter-spacing:.08em;background:linear-gradient(90deg,#fff,#d8c9ff 35%,#ff9fc5 70%,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}.prompt{font-size:18px;color:#ccc;font-weight:700}.timer{font-size:72px;font-weight:1000;line-height:1;margin:24px 0 8px}.status{min-height:42px;color:#aaa;font-size:14px;display:flex;align-items:center;text-align:center}.sw{font-size:12px;color:#82828b;text-align:center;margin-top:14px}
.cover{width:min(68%,245px);aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 16px 38px #0007;margin:3px 0 14px;display:none}.cover.show{display:block}.year{font-size:40px;font-weight:1000;background:linear-gradient(90deg,#d8c9ff,#ff9fc5,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}.title{font-size:28px;line-height:1.05;font-weight:950;margin:17px 0 8px}.artist{font-size:20px;color:#ccc;font-weight:750}.ans{position:absolute;top:20px;left:0;right:0;color:#888;font-size:11px;letter-spacing:.16em;font-weight:800}
.controls{margin-top:12px}.prog{height:5px;background:#24242a;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#eee;width:0}.small{font-size:12px;color:#777;text-align:center;margin-top:10px}

.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.playerBox{border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:8px 10px;background:rgba(255,255,255,.05);transition:.2s}.playerBox.active{background:linear-gradient(135deg,rgba(141,92,255,.25),rgba(255,95,158,.20));border-color:rgba(255,255,255,.30);box-shadow:0 0 20px rgba(141,92,255,.15)}.pname{font-size:12px;color:#bbb}.pscore{font-size:24px;font-weight:1000}.turn{font-size:12px;color:#cfcfd8;text-align:center;margin:-2px 0 8px}.scoreChecks{width:100%;display:grid;grid-template-columns:1fr;gap:7px;margin-top:12px}.checkRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}.checkRow label{font-size:14px;font-weight:800}.checkRow input{width:22px;height:22px;accent-color:#a66cff}.back .cover{width:min(56%,190px);margin-top:25px;margin-bottom:10px}.back .title{font-size:24px;margin:10px 0 5px}.back .artist{font-size:18px}.endPanel{padding:25px;text-align:center;background:linear-gradient(145deg,#21172e,#111117);border-radius:24px;border:1px solid #393042;margin-top:10vh}.endPanel h2{font-size:34px;margin:0 0 14px}.winner{font-size:23px;font-weight:900;margin:12px 0 20px}.statline{display:flex;justify-content:space-between;margin:8px 0;color:#ddd}.decadeBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 14px}.decadeBtns button{padding:9px 5px;font-size:12px;background:#2a2634;color:#ddd;border:1px solid #423a51}.decadeBtns button.sel{background:linear-gradient(90deg,#8d5cff,#ff5f9e);color:#fff}.nameInputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nameInputs input{width:100%;padding:12px;border-radius:12px;background:#24242b;color:#fff;border:1px solid #3b3b43}
</style></head><body><div class="app">
<section id="setup" class="setup"><h1>HIT30</h1><p>Configura la partida.</p>
<div class="intro-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="f"><label>Canciones</label><select id="size"><option>25</option><option>50</option><option selected>100</option><option>250</option><option>500</option><option>1000</option></select></div>
<div class="r"><div class="f"><label>Desde</label><select id="yf"></select></div><div class="f"><label>Hasta</label><select id="yt"></select></div></div>
<div class="f"><label>Década rápida</label><div class="decadeBtns" id="decades"><button data-from="1960" data-to="1969">60s</button><button data-from="1970" data-to="1979">70s</button><button data-from="1980" data-to="1989">80s</button><button data-from="1990" data-to="1999">90s</button><button data-from="2000" data-to="2009">00s</button><button data-from="2010" data-to="2019">10s</button><button data-from="2020" data-to="2026">20s</button><button data-from="1960" data-to="2026">Todas</button></div></div>
<div class="f"><label>Selección</label><select id="mix"><option value="all" selected>Éxitos en España</option></select></div>
<div class="f"><label>Jugadores</label><div class="nameInputs"><input id="p1name" value="Jugador 1" maxlength="18"><input id="p2name" value="Jugador 2" maxlength="18"></div></div>
<button id="start" class="p">Empezar partida</button><button id="resetHistory" class="s">Reiniciar historial de canciones</button><div id="historyInfo" class="small"></div></section>

<section id="game" class="hidden"><header><div class="brand">HIT30</div><div id="count" class="count"></div><button id="newg" class="g">Nueva</button></header><div class="scoreboard"><div id="pbox0" class="playerBox active"><div id="pname0" class="pname">Jugador 1</div><div id="pscore0" class="pscore">0</div></div><div id="pbox1" class="playerBox"><div id="pname1" class="pname">Jugador 2</div><div id="pscore1" class="pscore">0</div></div></div><div id="turnLabel" class="turn"></div>
<div id="scene" class="scene"><div id="card" class="card">
<section class="face front"><div><div class="k">ADIVINA LA CANCIÓN</div><div id="num" class="n"></div></div><div class="mid"><div class="logo">HIT30</div><div class="prompt">Escucha y adivina</div><div id="timer" class="timer">30</div><div id="status" class="status"></div></div>
<button id="login" class="p hidden">Conectar con Spotify</button><button id="play" class="p hidden">▶ Escuchar 30 segundos</button><button id="pause" class="s hidden">■ Parar</button><div class="sw">Desliza o toca la tarjeta para descubrir</div></section>
<section class="face back"><div class="ans">RESPUESTA</div><img id="cover" class="cover"><div id="year" class="year"></div><div id="title" class="title"></div><div id="artist" class="artist"></div><div class="scoreChecks"><div class="checkRow"><label>Artista +1</label><input id="chkArtist" type="checkbox"></div><div class="checkRow"><label>Canción +1</label><input id="chkSong" type="checkbox"></div><div class="checkRow"><label>Año +1</label><input id="chkYear" type="checkbox"></div></div></section>
</div></div><div class="controls"><button id="next" class="p hidden">Siguiente tarjeta →</button><div class="prog"><div id="bar" class="bar"></div></div></div></section><section id="endPanel" class="endPanel hidden"><h2>Partida terminada</h2><div id="winner" class="winner"></div><div id="endStats"></div><button id="backHome" class="p" style="margin-top:18px">Nueva partida</button></section></div><script src="catalogo-v10.js?v=10"></script>
<script>
const CLIENT_ID="4473f3716282436ea5312f0aba46455b", REDIRECT_URI=location.origin+location.pathname, SCOPES=["user-read-playback-state","user-modify-playback-state"];
const TRACKS=window.HIT30_CATALOG||[];
const $=x=>document.getElementById(x); let deck=[],pos=0,cur=null,total=0,st=null,it=null,sx=null,block=0;let players=[{name:"Jugador 1",score:0,a:0,s:0,y:0},{name:"Jugador 2",score:0,a:0,s:0,y:0}],turn=0;
for(let y=1960;y<=2026;y++){yf.add(new Option(y,y));yt.add(new Option(y,y))} yf.value=1960;yt.value=2026;
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function b64(b){return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")} async function sha(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))} function ver(){return b64(crypto.getRandomValues(new Uint8Array(64)))} function show(x){status.textContent=x}

function playedSet(){try{return new Set(JSON.parse(localStorage.getItem("hit30_played_v10")||"[]"))}catch(e){return new Set()}}
function savePlayed(s){localStorage.setItem("hit30_played_v10",JSON.stringify([...s]));updateHistoryInfo()}
function updateHistoryInfo(){let n=playedSet().size;if(window.historyInfo)historyInfo.textContent=`${n} canciones ya utilizadas. No volverán a salir hasta reiniciar el historial.`}
function artistTokens(s){
 return (s||"").toLowerCase()
   .replace(/\b(feat\.?|featuring|with|x)\b/g,"/")
   .split(/\/|,|&| y /)
   .map(x=>x.trim()).filter(x=>x.length>1)
}
function separateArtists(list,minGap=9){
 let src=[...list],out=[],recent=[];
 while(src.length){
   let idx=src.findIndex(x=>{
     let toks=artistTokens(x.artist);
     return !toks.some(t=>recent.includes(t))
   });
   if(idx<0)idx=0;
   let [x]=src.splice(idx,1);out.push(x);
   artistTokens(x.artist).forEach(t=>recent.push(t));
   if(recent.length>minGap*2)recent=recent.slice(-minGap*2)
 }
 return out
}
function pool(){
 let used=playedSet();
 let a=TRACKS.filter(t=>t.year>=+yf.value&&t.year<=+yt.value&&!used.has(t.id));
 let n=Math.min(+size.value,a.length);
 return separateArtists(sh(a).slice(0,n),9)
}
function updateScoreboard(){pname0.textContent=players[0].name;pname1.textContent=players[1].name;pscore0.textContent=players[0].score;pscore1.textContent=players[1].score;pbox0.classList.toggle("active",turn===0);pbox1.classList.toggle("active",turn===1);turnLabel.textContent=`Turno de ${players[turn].name}`}
async function enterFullscreen(){
 try{
   if(!document.fullscreenElement && document.documentElement.requestFullscreen){
     await document.documentElement.requestFullscreen({navigationUI:"hide"});
   }
 }catch(e){}
}
function begin(){enterFullscreen();if(+yf.value>+yt.value)return alert("Revisa el intervalo de años.");deck=pool();if(!deck.length)return alert("Ya has utilizado todas las canciones disponibles con esos filtros. Cambia filtros o reinicia el historial.");players=[{name:(p1name.value.trim()||"Jugador 1"),score:0,a:0,s:0,y:0},{name:(p2name.value.trim()||"Jugador 2"),score:0,a:0,s:0,y:0}];turn=0;pos=0;total=deck.length;cur=deck[0];setup.classList.add("hidden");endPanel.classList.add("hidden");game.classList.remove("hidden");render()}
function render(){let used=playedSet();used.add(cur.id);savePlayed(used);card.classList.remove("flip");next.classList.add("hidden");pause.classList.add("hidden");timer.textContent=30;num.textContent="Tarjeta "+(pos+1);count.textContent=(pos+1)+" / "+total;year.textContent=cur.year;title.textContent=cur.title;artist.textContent=cur.artist;cover.classList.remove("show");cover.removeAttribute("src");bar.style.width=((pos+1)/total*100)+"%";chkArtist.checked=chkSong.checked=chkYear.checked=false;updateScoreboard();auth();loadCover()}
function applyCardScore(){let a=chkArtist.checked?1:0,s=chkSong.checked?1:0,y=chkYear.checked?1:0;players[turn].score+=a+s+y;players[turn].a+=a;players[turn].s+=s;players[turn].y+=y}

let mbLast=0;
function mbKey(){return (cur.artist+"|"+cur.title).toLowerCase()}
async function originalYear(){
 const k=mbKey();
 try{
   const cache=JSON.parse(localStorage.getItem("hit30_year_cache_v10")||"{}");
   if(cache[k])return cache[k];
   const wait=Math.max(0,1100-(Date.now()-mbLast));
   if(wait)await new Promise(r=>setTimeout(r,wait));
   mbLast=Date.now();
   const q=`recording:"${cur.title.replace(/"/g,"")}" AND artist:"${cur.artist.split("/")[0].trim().replace(/"/g,"")}"`;
   const r=await fetch("https://musicbrainz.org/ws/2/recording/?fmt=json&limit=5&query="+encodeURIComponent(q));
   if(!r.ok)throw Error("MB");
   const d=await r.json();
   const rec=(d.recordings||[]).find(x=>x["first-release-date"]&&/^\d{4}/.test(x["first-release-date"]));
   if(rec){
     const y=rec["first-release-date"].slice(0,4);
     cache[k]=y;localStorage.setItem("hit30_year_cache_v10",JSON.stringify(cache));
     return y
   }
 }catch(e){}
 return String(cur.year)
}
async function revealYear(){
 const y=await originalYear();
 if(card.classList.contains("flip"))year.textContent=y;
}
function flip(){if(Date.now()<block)return;card.classList.toggle("flip");if(card.classList.contains("flip")){next.classList.remove("hidden");revealYear()}}
function finishGame(){applyCardScore();stop(true);game.classList.add("hidden");endPanel.classList.remove("hidden");let p0=players[0],p1=players[1];winner.textContent=p0.score===p1.score?`Empate: ${p0.score} - ${p1.score}`:(p0.score>p1.score?`🏆 ${p0.name} gana ${p0.score} - ${p1.score}`:`🏆 ${p1.name} gana ${p1.score} - ${p0.score}`);endStats.innerHTML=`<div class="statline"><b>${p0.name}</b><b>${p0.score} puntos</b></div><div class="statline"><span>Artistas ${p0.a} · Canciones ${p0.s} · Años ${p0.y}</span></div><hr style="border-color:#333"><div class="statline"><b>${p1.name}</b><b>${p1.score} puntos</b></div><div class="statline"><span>Artistas ${p1.a} · Canciones ${p1.s} · Años ${p1.y}</span></div>`}
function nxt(){if(pos+1>=total){finishGame();return}applyCardScore();turn=1-turn;stop(true);cur=deck[++pos];render()}
async function loginFn(){let v=ver();sessionStorage.v=v;sessionStorage.state=crypto.randomUUID();sessionStorage.resume=JSON.stringify({ids:deck.map(x=>x.id),pos,total,players,turn});let p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,code_challenge_method:"S256",code_challenge:b64(await sha(v)),state:sessionStorage.state,scope:SCOPES.join(" ")});location.href="https://accounts.spotify.com/authorize?"+p}
async function exchange(c){let b=new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code:c,redirect_uri:REDIRECT_URI,code_verifier:sessionStorage.v}),r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b});if(!r.ok)throw Error("No se pudo conectar con Spotify");let t=await r.json();localStorage.at=t.access_token;localStorage.exp=Date.now()+t.expires_in*1000;if(t.refresh_token)localStorage.rt=t.refresh_token;history.replaceState({},"",REDIRECT_URI)}
async function refresh(){if(!localStorage.rt)return false;let b=new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:localStorage.rt}),r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b});if(!r.ok)return false;let t=await r.json();localStorage.at=t.access_token;localStorage.exp=Date.now()+t.expires_in*1000;if(t.refresh_token)localStorage.rt=t.refresh_token;return true}
async function tok(){if(Date.now()<+(localStorage.exp||0)-30000)return localStorage.at;if(await refresh())return localStorage.at;return null}
async function api(p,o={}){let t=await tok();if(!t)throw Error("LOGIN");let r=await fetch("https://api.spotify.com/v1"+p,{...o,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json",...(o.headers||{})}});if(r.status===401&&await refresh())return api(p,o);return r}
async function dev(){let r=await api("/me/player/devices");if(!r.ok)return null;let d=(await r.json()).devices||[];return d.find(x=>x.is_active)||d[0]||null}
async function resolve(){
 if(cur.uri)return cur.uri;
 let x=null;
 if(cur.spotify_id){
   try{
     let tr=await api("/tracks/"+encodeURIComponent(cur.spotify_id)+"?market=ES");
     if(tr.ok)x=await tr.json();
   }catch(e){}
 }
 if(!x){
   let q="track:"+cur.title+" artist:"+cur.artist;
   let r=await api("/search?type=track&limit=5&market=ES&q="+encodeURIComponent(q));
   let d=await r.json(),a=d.tracks?.items||[];
   if(!a.length){
     r=await api("/search?type=track&limit=5&market=ES&q="+encodeURIComponent(cur.title+" "+cur.artist));
     d=await r.json();a=d.tracks?.items||[]
   }
   if(!a.length)throw Error("NF");
   x=a[0]
 }
 cur.uri=x.uri;
 cur.spotify_id=x.id||cur.spotify_id||"";
 cur.cover=x.album?.images?.[0]?.url||"";
 cur.duration=x.duration_ms||0;
 return cur.uri
}
async function loadCover(){try{await resolve();if(cur.cover){cover.src=cur.cover;cover.classList.add("show")}}catch(e){}}
