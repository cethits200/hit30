<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIT30 Digital</title>
<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#0b0b0e;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.app{width:min(100%,460px)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;color:#b9b9c2;font-size:14px
}
.brand{font-weight:900;letter-spacing:.12em;color:#fff}
button{
  border:0;border-radius:14px;padding:14px 16px;
  font-size:16px;font-weight:800;cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:#fff;color:#111;width:100%}
.btn-secondary{background:#24242b;color:#fff;width:100%;margin-top:10px}
.btn-ghost{background:transparent;color:#cfcfd6;padding:8px 10px;font-size:13px}

.scene{
  perspective:1200px;
  width:100%;
  aspect-ratio:3/4.25;
  margin:auto;
}
.card{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .58s cubic-bezier(.2,.7,.2,1);
  border-radius:28px;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  border-radius:28px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  border:1px solid #34343c;
  box-shadow:0 22px 60px rgba(0,0,0,.45);
}
.front{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 34%),
    linear-gradient(145deg,#17171d,#101014);
  display:flex;flex-direction:column;
  padding:28px;
}
.back{
  transform:rotateY(180deg);
  background:
    radial-gradient(circle at 78% 14%, rgba(255,255,255,.08), transparent 30%),
    linear-gradient(145deg,#191920,#101014);
  display:flex;flex-direction:column;justify-content:center;
  text-align:center;padding:32px;
}
.kicker{
  font-size:13px;letter-spacing:.16em;color:#9f9faa;
  font-weight:800;text-transform:uppercase
}
.cardnum{margin-top:6px;font-size:14px;color:#c6c6ce}
.center{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center
}
.logo{
  font-size:48px;font-weight:1000;letter-spacing:.08em;
  margin:0 0 6px
}
.prompt{color:#c8c8d0;font-size:18px;font-weight:700}
.timer{
  font-size:72px;font-weight:1000;
  font-variant-numeric:tabular-nums;
  line-height:1;margin:24px 0 8px
}
.status{
  min-height:46px;color:#a9a9b3;font-size:14px;
  text-align:center;display:flex;align-items:center;
  justify-content:center;padding:0 8px
}
.swipe{
  margin-top:16px;text-align:center;font-size:13px;color:#85858e
}
.year{font-size:56px;font-weight:1000;line-height:1}
.title{font-size:30px;font-weight:950;line-height:1.06;margin:24px 0 10px}
.artist{font-size:21px;color:#cacad1;font-weight:700}
.answerlabel{
  position:absolute;top:24px;left:0;right:0;
  font-size:12px;letter-spacing:.15em;color:#8f8f99;
  font-weight:800
}
.controls{margin-top:14px}
.hidden{display:none!important}
.progresswrap{
  margin-top:12px;height:5px;border-radius:999px;background:#24242a;overflow:hidden
}
.progress{height:100%;width:0;background:#e9e9ee;transition:width .25s}
.hint{font-size:12px;color:#777783;text-align:center;margin:11px 0 0}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">HIT30</div>
    <div id="counter">0 / 5</div>
    <button id="reset" class="btn-ghost">Reiniciar</button>
  </div>

  <div class="scene" id="scene">
    <div class="card" id="card">
      <section class="face front">
        <div>
          <div class="kicker">Adivina la canción</div>
          <div class="cardnum" id="cardnum">Tarjeta</div>
        </div>

        <div class="center">
          <div class="logo">HIT30</div>
          <div class="prompt">Escucha y adivina</div>
          <div class="timer" id="timer">30</div>
          <div class="status" id="status">Preparando partida…</div>
        </div>

        <button id="login" class="btn-primary hidden">Conectar con Spotify</button>
        <button id="play" class="btn-primary hidden">▶ Escuchar 30 segundos</button>
        <button id="pause" class="btn-secondary hidden">■ Parar</button>
        <div class="swipe">Desliza hacia la izquierda o toca la tarjeta para descubrir</div>
      </section>

      <section class="face back">
        <div class="answerlabel">RESPUESTA</div>
        <div class="year" id="year">1996</div>
        <div class="title" id="title">Canción</div>
        <div class="artist" id="artist">Artista</div>
      </section>
    </div>
  </div>

  <div class="controls">
    <button id="next" class="btn-primary hidden">Siguiente tarjeta →</button>
    <div class="progresswrap"><div class="progress" id="progress"></div></div>
    <div class="hint">Las canciones no se repiten hasta terminar la partida.</div>
  </div>
</div>

<script>
const CLIENT_ID = "4473f3716282436ea5312f0aba46455b";
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = ["user-read-playback-state","user-modify-playback-state"];

const TRACKS = [
  {id:"001", title:"Macarena - Bayside Boys Remix", artist:"Los Del Rio", year:"1996", uri:"spotify:track:7obdw7ZGr6l1GqSBkFiY11"},
  {id:"002", title:"Rhythm Is A Dancer", artist:"SNAP!", year:"1992", uri:"spotify:track:1IWzfq3sLedGQ3fb2hAMBA"},
  {id:"003", title:"Wannabe", artist:"Spice Girls", year:"1996", uri:"spotify:track:1Je1IMUlBXcx1Fz0WE7oPT"},
  {id:"004", title:"Believe", artist:"Cher", year:"1998", uri:"spotify:track:2goLsvvODILDzeeiT4dAoR"},
  {id:"005", title:"Livin' la Vida Loca", artist:"Ricky Martin", year:"1999", uri:"spotify:track:0Ph6L4l8dYUuXFmb71Ajnd"}
];

const $ = id => document.getElementById(id);
let deck = [];
let current = null;
let played = 0;
let stopTimer = null;
let tickTimer = null;
let left = 30;
let touchStartX = null;
let suppressFlipUntil = 0;

function b64url(bytes){
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")
}
async function sha256(s){
  return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))
}
function randomVerifier(){return b64url(crypto.getRandomValues(new Uint8Array(64)))}
function show(msg){$("status").textContent=msg}

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function loadDeck(){
  try{
    const saved=JSON.parse(localStorage.getItem("hit30_deck")||"null");
    if(saved && Array.isArray(saved.deck) && saved.deck.length && saved.current){
      deck=saved.deck;
      current=TRACKS.find(t=>t.id===saved.current)||null;
      played=saved.played||0;
      if(current) return;
    }
  }catch(e){}
  resetGame(false);
}
function saveDeck(){
  localStorage.setItem("hit30_deck",JSON.stringify({
    deck:deck.map(t=>t.id),
    current:current?.id||null,
    played
  }));
}
function inflateDeck(){
  deck=deck.map(x=>typeof x==="string"?TRACKS.find(t=>t.id===x):x).filter(Boolean);
}
function resetGame(confirmFirst=true){
  if(confirmFirst && !confirm("¿Reiniciar la partida y volver a mezclar las canciones?")) return;
  stopPlayback(true);
  deck=shuffle(TRACKS);
  current=deck.shift();
  played=1;
  saveDeck();
  renderCurrent();
}
function renderCurrent(){
  inflateDeck();
  $("card").classList.remove("flipped");
  $("next").classList.add("hidden");
  $("cardnum").textContent=`Tarjeta ${current.id}`;
  $("year").textContent=current.year;
  $("title").textContent=current.title;
  $("artist").textContent=current.artist;
  $("counter").textContent=`${played} / ${TRACKS.length}`;
  $("progress").style.width=`${(played/TRACKS.length)*100}%`;
  $("timer").textContent="30";
  $("pause").classList.add("hidden");
  updateAuthUI();
}
function nextCard(){
  stopPlayback(true);
  inflateDeck();
  if(deck.length===0){
    $("card").classList.remove("flipped");
    $("next").classList.add("hidden");
    $("play").classList.add("hidden");
    show("¡Partida terminada! Has escuchado todas las canciones.");
    $("cardnum").textContent="Fin de partida";
    $("timer").textContent="✓";
    localStorage.removeItem("hit30_deck");
    return;
  }
  current=deck.shift();
  played++;
  saveDeck();
  renderCurrent();
}
function flipCard(){
  if(Date.now()<suppressFlipUntil) return;
  $("card").classList.toggle("flipped");
  if($("card").classList.contains("flipped")){
    $("next").classList.remove("hidden");
  }
}
async function login(){
  const verifier=randomVerifier();
  sessionStorage.setItem("verifier",verifier);
  const challenge=b64url(await sha256(verifier));
  const state=crypto.randomUUID();
  sessionStorage.setItem("oauth_state",state);
  const p=new URLSearchParams({
    client_id:CLIENT_ID,
    response_type:"code",
    redirect_uri:REDIRECT_URI,
    code_challenge_method:"S256",
    code_challenge:challenge,
    state,
    scope:SCOPES.join(" ")
  });
  location.href="https://accounts.spotify.com/authorize?"+p;
}
async function exchangeCode(code){
  const verifier=sessionStorage.getItem("verifier");
  const body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:"authorization_code",
    code,
    redirect_uri:REDIRECT_URI,
    code_verifier:verifier
  });
  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });
  if(!r.ok) throw new Error("No se pudo completar el acceso a Spotify");
  const t=await r.json();
  localStorage.setItem("access_token",t.access_token);
  localStorage.setItem("expires_at",Date.now()+t.expires_in*1000);
  if(t.refresh_token) localStorage.setItem("refresh_token",t.refresh_token);
  history.replaceState({}, "", REDIRECT_URI);
}
async function refreshToken(){
  const rt=localStorage.getItem("refresh_token");
  if(!rt) return false;
  const body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:"refresh_token",
    refresh_token:rt
  });
  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });
  if(!r.ok) return false;
  const t=await r.json();
  localStorage.setItem("access_token",t.access_token);
  localStorage.setItem("expires_at",Date.now()+t.expires_in*1000);
  if(t.refresh_token) localStorage.setItem("refresh_token",t.refresh_token);
  return true;
}
async function token(){
  if(Date.now() < +(localStorage.getItem("expires_at")||0)-30000)
    return localStorage.getItem("access_token");
  if(await refreshToken()) return localStorage.getItem("access_token");
  return null;
}
async function api(path,opt={}){
  let tk=await token();
  if(!tk) throw new Error("LOGIN");
  const r=await fetch("https://api.spotify.com/v1"+path,{
    ...opt,
    headers:{
      Authorization:"Bearer "+tk,
      "Content-Type":"application/json",
      ...(opt.headers||{})
    }
  });
  if(r.status===401 && await refreshToken()) return api(path,opt);
  return r;
}
async function device(){
  const r=await api("/me/player/devices");
  if(!r.ok) return null;
  const d=(await r.json()).devices||[];
  return d.find(x=>x.is_active)||d[0]||null;
}
async function stopPlayback(silent=false){
  clearTimeout(stopTimer);
  clearInterval(tickTimer);
  try{
    if(await token()) await api("/me/player/pause",{method:"PUT"});
  }catch(e){}
  left=30;
  $("timer").textContent="30";
  $("pause").classList.add("hidden");
  if(!silent){
    $("play").classList.remove("hidden");
    show("Reproducción detenida. Ya puedes descubrir la respuesta.");
  }
}
async function play30(ev){
  ev?.stopPropagation();
  suppressFlipUntil=Date.now()+500;
  try{
    const d=await device();
    if(!d){
      show("Abre Spotify, reproduce cualquier canción unos segundos y vuelve aquí.");
      return;
    }
    const r=await api("/me/player/play?device_id="+encodeURIComponent(d.id),{
      method:"PUT",
      body:JSON.stringify({uris:[current.uri],position_ms:0})
    });
    if(!r.ok){
      show("Spotify no ha iniciado la pista. Comprueba Premium y el dispositivo.");
      return;
    }
    $("play").classList.add("hidden");
    $("pause").classList.remove("hidden");
    left=30;
    $("timer").textContent=left;
    show("¡Escucha y adivina!");
    tickTimer=setInterval(()=>{
      left=Math.max(0,left-1);
      $("timer").textContent=left;
    },1000);
    stopTimer=setTimeout(async()=>{
      await stopPlayback(true);
      $("play").classList.remove("hidden");
      show("Tiempo terminado. Desliza o toca la tarjeta para descubrir.");
    },30000);
  }catch(e){
    if(e.message==="LOGIN"){
      updateAuthUI();
      show("Conecta Spotify para jugar.");
    }else{
      show("Error al controlar Spotify.");
    }
  }
}
async function updateAuthUI(){
  const tk=await token();
  if(tk){
    $("login").classList.add("hidden");
    $("play").classList.remove("hidden");
    show("Tarjeta lista.");
  }else{
    $("play").classList.add("hidden");
    $("login").classList.remove("hidden");
    show("Conecta Spotify una vez para empezar.");
  }
}

$("scene").addEventListener("click", e=>{
  if(e.target.closest("button")) return;
  flipCard();
});
$("scene").addEventListener("touchstart",e=>{
  touchStartX=e.changedTouches[0].screenX;
},{passive:true});
$("scene").addEventListener("touchend",e=>{
  if(touchStartX===null) return;
  const dx=e.changedTouches[0].screenX-touchStartX;
  touchStartX=null;
  if(Math.abs(dx)>45){
    suppressFlipUntil=Date.now()+250;
    flipCard();
  }
},{passive:true});

$("login").onclick=e=>{e.stopPropagation();login()};
$("play").onclick=play30;
$("pause").onclick=e=>{e.stopPropagation();suppressFlipUntil=Date.now()+500;stopPlayback(false)};
$("next").onclick=nextCard;
$("reset").onclick=()=>resetGame(true);

(async()=>{
  const q=new URLSearchParams(location.search);
  if(q.get("code")){
    try{
      if(q.get("state")!==sessionStorage.getItem("oauth_state"))
        throw new Error("Estado OAuth no válido");
      await exchangeCode(q.get("code"));
    }catch(e){
      show(e.message);
    }
  }
  loadDeck();
  inflateDeck();
  renderCurrent();
})();
</script>
</body>
</html>
