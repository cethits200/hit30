<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CetHits · Diagnóstico catálogo</title><style>body{background:#111827;color:white;font:17px system-ui;margin:0 auto;padding:24px;max-width:680px}h1{color:#ffb52b}button{background:#ffb52b;border:0;border-radius:10px;padding:15px;font-weight:bold;font-size:16px}pre{background:#293445;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:10px;line-height:1.6}</style></head><body><h1>CetHits · Diagnóstico de canciones</h1><p>Comprueba si Spotify permite buscar canciones y consultar pistas. No reproduce música ni modifica el juego.</p><button id="go">Comprobar catálogo</button><pre id="out">Esperando prueba.</pre><p>Envíame una captura del resultado. No compartas tokens.</p><script>
const out=document.getElementById('out');function log(t){out.textContent+=t+'\n'}
document.getElementById('go').onclick=async()=>{out.textContent='';try{let token=localStorage.getItem('at'),exp=Number(localStorage.getItem('exp')||0);if(!token||Date.now()>exp){log('No hay token vigente. Abre CetHits en este navegador y vuelve.');return}async function test(name,path){try{const r=await fetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+token}});let data=await r.json().catch(()=>({}));log(name+': HTTP '+r.status);if(!r.ok)log('Mensaje: '+(data.error?.message||data.error||'sin detalles'));else if(name==='Búsqueda')log('Resultados: '+(data.tracks?.items?.length??'no disponible'));else if(name==='Consulta pista')log('Pista encontrada: '+(data.name?'Sí':'No'));}catch(e){log(name+': '+e.message)}}
await test('Búsqueda','/search?type=track&limit=5&market=ES&q='+encodeURIComponent('track:Billie Jean artist:Michael Jackson'));
await test('Consulta pista','/tracks/5ChkMS8OtdzJeqyybCc9R5?market=ES');log('Prueba finalizada.');
}catch(e){log('Error: '+e.message)}};
</script></body></html>
