<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CetHits Diagnóstico</title><style>body{background:#111827;color:white;font:16px system-ui;padding:20px;max-width:650px;margin:auto}button{background:#ffb52b;border:0;border-radius:10px;padding:15px;font-weight:bold}pre{background:#293241;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#ffb52b}</style><h1>CetHits · Diagnóstico Spotify</h1><p>Esta prueba no reproduce canciones ni modifica el juego. Comprueba la autorización y los dispositivos disponibles.</p><button onclick="check()">Comprobar Spotify</button><pre id="result">Pulsa el botón.</pre><script>
async function check(){let o=document.getElementById('result');o.textContent='';const say=s=>o.textContent+=s+'\n';let token=localStorage.getItem('at'),refresh=localStorage.getItem('rt'),expiry=Number(localStorage.getItem('exp')||0);say('Token guardado: '+(token?'Sí':'No'));say('Renovación disponible: '+(refresh?'Sí':'No'));say('Token vigente: '+(expiry>Date.now()?'Sí':'No'));if(!token){say('No hay sesión autorizada en este navegador. Conecta Spotify desde CetHits y vuelve aquí.');return}if(expiry<Date.now()+30000){say('La autorización ha caducado. Esta prueba no altera tus credenciales.');return}for(const path of ['/me','/me/player/devices','/me/player']){try{const r=await fetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+token}});const j=await r.json().catch(()=>({}));say(path+' → HTTP '+r.status);if(!r.ok)say('Motivo: '+(j.error?.message||j.error||'no especificado'));if(path==='/me'&&r.ok)say('Plan: '+j.product);if(path.includes('devices')&&r.ok){say('Dispositivos: '+(j.devices||[]).length);for(const d of j.devices||[])say('• '+d.name+'; activo='+d.is_active+'; restringido='+d.is_restricted)}}catch(e){say(path+' → '+e.message)}}say('Fin de la prueba. Envía una captura del resultado, sin datos personales.')} </script></html>
